name: Build VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Locate built VST3 and stage dist folder
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "Scale Operator.vst3" -Directory | Select-Object -First 1
          if (-not $vst3) { throw "Could not find built Scale Operator.vst3" }
          Write-Host "Found: $($vst3.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $vst3.FullName "dist/Scale Operator.vst3"

      - name: Download VC++ Redistributable
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Commit built installer to build-output branch
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout --orphan build-output
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p outgoing
          mv installer_out/ScaleOperatorSetup.exe outgoing/
          git add outgoing/ScaleOperatorSetup.exe
          git commit -m "Built installer $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin build-output
